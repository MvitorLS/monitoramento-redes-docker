global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

receivers:
  # Sem notificação externa: os alertas ficam visíveis em http://localhost:9093.
  - name: 'default-receiver'

  # Telegram: crie o arquivo alertmanager/telegram_token com o token do @BotFather,
  # preencha o chat_id e troque o receiver da rota acima para 'telegram'.
  - name: 'telegram'
    telegram_configs:
      - bot_token_file: /etc/alertmanager/config/telegram_token
        chat_id: 123456789
        parse_mode: HTML
