name: monitoramento-redes

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: netmon_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - netmon_net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: netmon_blackbox
    restart: unless-stopped
    cap_add:
      - NET_RAW
    command:
      - '--config.file=/etc/blackboxexporter/config.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackboxexporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - netmon_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: netmon_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - netmon_net

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: netmon_snmp_exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    networks:
      - netmon_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: netmon_alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - netmon_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: netmon_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - netmon_net

  grafana:
    image: grafana/grafana-oss:11.1.3
    container_name: netmon_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/network_overview.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - netmon_net

networks:
  netmon_net:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
